[package]
name = "openmirror-desktop"
version = "0.5.0"
description = "Desktop app for openmirror, an open-source digital twin"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

# The webview itself on Linux, to give the daemon's page a microphone: see
# `allow_microphone` in main.rs. The version wry uses, so the types are the same.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
