[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmirror"
version = "0.3.0"
description = "An open-source digital twin: PC control, duplex voice, opt-in memory, and per-modality provider choice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "aiohttp>=3.10",
  "websockets>=13.0",
  # Memory only. Brute-force cosine over a few thousand quantised vectors,
  # which is a dot product, not a vector database.
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]
# Routing a provider's traffic through Tor. An extra rather than a dependency:
# an install that never turns it on should not carry a SOCKS stack, and the
# error when it is missing names this extra.
tor = ["aiohttp-socks>=0.9"]
# Seeing and driving the screen. Needed for the desktop tools and for the
# autopilot; the browser tools work without it.
desktop = ["mss>=9.0", "pillow>=10.0"]
browser = ["playwright>=1.45"]
# A C scan over the memory index, in process. Optional because it is a loadable
# SQLite extension and `enable_load_extension` is a COMPILE-TIME Python option
# that not every build has -- so this cannot be a hard dependency without
# breaking installs that would otherwise work. Without it memory search falls
# back to a Python scan, which is correct and slower; the two paths are asserted
# to agree. Measured at fifty thousand memories: 12.9 ms against 107.6 ms for
# the scan's arithmetic alone, before the scan also pays to hydrate every row.
vec = ["sqlite-vec>=0.1.9"]

[project.scripts]
openmirror = "openmirror.main:main"
# This install as an MCP server on stdio, for a client that would rather spawn
# it than reach it over HTTP. See openmirror/mcp/server.py.
openmirror-mcp = "openmirror.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["openmirror"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
